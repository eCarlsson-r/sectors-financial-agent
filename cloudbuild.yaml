steps:
  # 1. Build Docker image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sectors-financial-agent:$COMMIT_SHA'
      - '.'

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sectors-financial-agent:$COMMIT_SHA'

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sectors-financial-agent'
      - '--image=gcr.io/$PROJECT_ID/sectors-financial-agent:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,SECTORS_API_KEY=SECTORS_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/sectors-financial-agent:$COMMIT_SHA'
